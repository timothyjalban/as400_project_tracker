services:
  - type: web
    name: order-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: ORDER_TRACKER_PRODUCTION
        value: "1"
      - key: ORDER_TRACKER_ENFORCE_HTTPS
        value: "1"
      - key: ORDER_TRACKER_COOKIE_SECURE
        value: "1"
      - key: ORDER_TRACKER_HOST
        value: "0.0.0.0"
      - key: ORDER_TRACKER_SECRET_KEY
        generateValue: true
      - key: ORDER_TRACKER_DB_PATH
        value: "/tmp/orders.db"
      - key: ORDER_TRACKER_ALLOW_INSECURE_DEFAULT_LOGIN
        value: "0"
      # Set these manually in the Render dashboard (never commit secrets):
      # - key: ORDER_TRACKER_ADMIN_USERNAME
      # - key: ORDER_TRACKER_ADMIN_PASSWORD_HASH
