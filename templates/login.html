<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker Login</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --border: #333;
            --text: #fff;
            --muted: #b0b0b0;
            --primary: #2196f3;
            --primary-hover: #1976d2;
            --error-bg: #4a1f1f;
            --error-border: #9b2c2c;
            --error-text: #ffb3b3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, rgba(33, 150, 243, 0.2), transparent 45%), var(--bg);
            color: var(--text);
        }

        .card {
            width: min(420px, 92vw);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 6px;
            color: var(--primary);
            font-size: 26px;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--muted);
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #272727;
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .error {
            margin-bottom: 12px;
            padding: 10px 12px;
            border: 1px solid var(--error-border);
            border-radius: 8px;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 13px;
        }

        button {
            width: 100%;
            border: 1px solid var(--primary);
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <form class="card" method="post" action="/login">
        <h1>Order Tracker</h1>
        <p>Sign in to continue.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <input type="hidden" name="next" value="{{ next_url or '/' }}">

        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit">Sign In</button>
    </form>
</body>
</html>
